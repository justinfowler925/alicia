name: Gate0Proof
options:
  bundleIdPrefix: com.clearspeed.alicia
  deploymentTarget:
    iOS: "17.0"
    macOS: "14.0"
settings:
  base:
    SWIFT_VERSION: "6.0"
    CURRENT_PROJECT_VERSION: 1
    MARKETING_VERSION: "0.1.0"
packages:
  Gate0Proof:
    path: .
targets:
  Gate0iOS:
    type: application
    platform: iOS
    sources:
      - path: Sources/Gate0iOS
    dependencies:
      - package: Gate0Proof
        product: Gate0Core
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.clearspeed.alicia.gate0
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_CFBundleDisplayName: Alicia Gate0
        # No microphone usage description — app must not capture mic audio.
        TARGETED_DEVICE_FAMILY: "1,2"
        CODE_SIGN_STYLE: Automatic
