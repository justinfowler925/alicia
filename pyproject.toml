[project]
name = "brutus"
version = "0.1.0"
description = "Brutus — MacBook client for Studio Atlas (ledger lives on Atlas6)"
requires-python = ">=3.12"
authors = [{ name = "jfstudio" }]
license = { text = "MIT" }

dependencies = [
    "httpx>=0.28",
    "anthropic>=0.69",
    "pyyaml>=6.0",
    "mcp>=1.2,<2",  # 2.0 removed mcp.server.fastmcp; stay on 1.x until Brutus migrates
    "fastapi>=0.115",
    "uvicorn>=0.32",
    "pydantic>=2.0",
    "cursor-sdk>=1.0.28,<2",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "ruff>=0.6",
]
voice = [
    "faster-whisper>=1.0",
    "pyaudio>=0.2",
    "numpy>=1.24",
    "pynput>=1.7",
    "livekit-agents>=1.7,<2",
    "livekit-api>=1.2,<2",
    "livekit-plugins-elevenlabs>=1.7,<2",
    "livekit-plugins-silero>=1.7,<2",
    "speechbrain>=1.1,<2",
    # Keep the audio extension ABI exactly aligned with its Torch runtime.
    "torch==2.11.0",
    "torchaudio==2.11.0",
]
# Platform-neutral subset used by CI and the browser voice worker. PyAudio is
# a local hotkey/microphone dependency and requires PortAudio system headers.
voice-stream = [
    "livekit-agents>=1.7,<2",
    "livekit-api>=1.2,<2",
    "livekit-plugins-elevenlabs>=1.7,<2",
    "livekit-plugins-silero>=1.7,<2",
]

[project.scripts]
brutus = "brutus.__main__:main"
brutus-mcp = "brutus.mcp_server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["brutus", "brutus_stack/brutus_stack"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 110
target-version = "py312"
